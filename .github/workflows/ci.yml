name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "README.md"
      - "packages/*/README.md"
      - "CHANGELOG.md"
      - "TASKS.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "README.md"
      - "packages/*/README.md"
      - "CHANGELOG.md"
      - "TASKS.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cmake --version
      - run: pnpm run check:native
