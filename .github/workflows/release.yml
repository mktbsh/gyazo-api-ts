name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "README.md"
      - "packages/*/README.md"
      - "CHANGELOG.md"
      - "TASKS.md"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:packages
      - name: Read release version
        id: version
        run: |
          version="$(node -p "require('./packages/gyazoctl/package.json').version")"
          node scripts/check-release-version.mjs "$version"
          test "$(node packages/gyazoctl/dist/index.mjs --version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: release packages"
          createGithubReleases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' && 'pnpm run release' || '' }}
          title: "chore: release packages"
          version: pnpm run version-packages

  release_state:
    needs: changesets
    if: needs.changesets.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.state.outputs.should_release }}
    steps:
      - name: Check published packages and release assets
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changesets.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if npm view "gyazo-api-sdk@$VERSION" version >/dev/null 2>&1 && npm view "gyazoctl@$VERSION" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          for os in darwin linux; do
            for arch in arm64 x64; do
              for suffix in tar.gz tar.gz.sha256; do
                if ! grep -qx "gyazoctl-$os-$arch.$suffix" <<< "$assets"; then
                  echo "should_release=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              done
            done
          done
          echo "should_release=false" >> "$GITHUB_OUTPUT"

  native:
    needs: [changesets, release_state]
    if: needs.release_state.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            file-arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
            file-arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            file-arch: aarch64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            file-arch: x86-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cmake --version
      - name: Build and package native binary
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_FILE_ARCH: ${{ matrix.file-arch }}
          OS: ${{ matrix.os }}
          VERSION: ${{ needs.changesets.outputs.version }}
        run: |
          node scripts/check-release-version.mjs "$VERSION"
          pnpm --filter gyazoctl run check:native
          pnpm --filter gyazoctl run build:native
          node scripts/native-smoke.mjs packages/gyazoctl/dist/native/gyazoctl "$VERSION"
          file packages/gyazoctl/dist/native/gyazoctl | grep -q "$EXPECTED_FILE_ARCH"
          mkdir -p "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/gyazoctl-$OS-$ARCH.tar.gz"
          tar -C packages/gyazoctl/dist/native -czf "$archive" gyazoctl
          (
            cd "$RUNNER_TEMP/release"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "gyazoctl-$OS-$ARCH.tar.gz" > "gyazoctl-$OS-$ARCH.tar.gz.sha256"
            else
              shasum -a 256 "gyazoctl-$OS-$ARCH.tar.gz" > "gyazoctl-$OS-$ARCH.tar.gz.sha256"
            fi
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: gyazoctl-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  github_release:
    needs: [changesets, release_state, native]
    if: needs.release_state.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: gyazoctl-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.changesets.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release/* --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "$tag" --generate-notes
          fi
