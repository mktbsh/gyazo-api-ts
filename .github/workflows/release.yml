name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node scripts/check-release-version.mjs "$version"
          test "$(node packages/gyazoctl/dist/index.mjs --version)" = "$version"

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            file-arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
            file-arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            file-arch: aarch64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            file-arch: x86-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cmake --version
      - name: Build and package native binary
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_FILE_ARCH: ${{ matrix.file-arch }}
          OS: ${{ matrix.os }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pnpm --filter gyazoctl run check:native
          pnpm --filter gyazoctl run build:native
          node scripts/native-smoke.mjs packages/gyazoctl/dist/native/gyazoctl "$version"
          file packages/gyazoctl/dist/native/gyazoctl | grep -q "$EXPECTED_FILE_ARCH"
          mkdir -p .context/release
          archive=".context/release/gyazoctl-${OS}-${ARCH}.tar.gz"
          tar -C packages/gyazoctl/dist/native -czf "$archive" gyazoctl
          (
            cd .context/release
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "gyazoctl-${OS}-${ARCH}.tar.gz" > "gyazoctl-${OS}-${ARCH}.tar.gz.sha256"
            else
              shasum -a 256 "gyazoctl-${OS}-${ARCH}.tar.gz" > "gyazoctl-${OS}-${ARCH}.tar.gz.sha256"
            fi
          )
          sh scripts/install-smoke.sh "$archive" "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: gyazoctl-${{ matrix.os }}-${{ matrix.arch }}
          path: .context/release/*
          if-no-files-found: error

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.5.1
      - name: Pack and publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node scripts/check-release-version.mjs "$version"
          mkdir -p .context/npm
          pnpm --filter gyazo-api-sdk pack --pack-destination "$GITHUB_WORKSPACE/.context/npm"
          pnpm --filter gyazoctl pack --pack-destination "$GITHUB_WORKSPACE/.context/npm"
          if ! npm view "gyazo-api-sdk@$version" version >/dev/null 2>&1; then
            npm publish ".context/npm/gyazo-api-sdk-$version.tgz" --access public --provenance
          fi
          if ! npm view "gyazoctl@$version" version >/dev/null 2>&1; then
            npm publish ".context/npm/gyazoctl-$version.tgz" --access public --provenance
          fi

  github-release:
    needs: [native, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: gyazoctl-*
          path: .context/release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .context/release/* install.sh --clobber
          else
            gh release create "$TAG" .context/release/* install.sh --verify-tag --generate-notes
          fi

  homebrew:
    needs: github-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: gyazoctl-*
          path: .context/release
          merge-multiple: true
      - name: Render and audit Formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          darwin_arm64_sha="$(shasum -a 256 .context/release/gyazoctl-darwin-arm64.tar.gz | awk '{print $1}')"
          darwin_x64_sha="$(shasum -a 256 .context/release/gyazoctl-darwin-x64.tar.gz | awk '{print $1}')"
          linux_arm64_sha="$(shasum -a 256 .context/release/gyazoctl-linux-arm64.tar.gz | awk '{print $1}')"
          linux_x64_sha="$(shasum -a 256 .context/release/gyazoctl-linux-x64.tar.gz | awk '{print $1}')"
          gh auth setup-git
          gh repo clone mktbsh/homebrew-tap .context/homebrew-tap
          git -C .context/homebrew-tap config user.name github-actions[bot]
          git -C .context/homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node scripts/render-formula.mjs "$version" "$darwin_arm64_sha" "$darwin_x64_sha" "$linux_arm64_sha" "$linux_x64_sha" .context/homebrew-tap/Formula/gyazoctl.rb
          git -C .context/homebrew-tap add Formula/gyazoctl.rb
          if ! git -C .context/homebrew-tap diff --cached --quiet; then
            git -C .context/homebrew-tap commit -m "gyazoctl $version"
          fi
          brew tap mktbsh/tap "$GITHUB_WORKSPACE/.context/homebrew-tap"
          brew audit --formula --strict mktbsh/tap/gyazoctl
          brew install mktbsh/tap/gyazoctl
          test "$(gyazoctl --version)" = "$version"
          git -C .context/homebrew-tap push origin HEAD:main
