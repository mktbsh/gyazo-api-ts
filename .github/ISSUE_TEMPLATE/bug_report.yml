name: バグ報告
description: 再現可能な問題を報告する
title: "[Bug]: "
body:
  - type: dropdown
    id: component
    attributes:
      label: 対象
      options:
        - gyazo-api-sdk
        - gyazoctl (npm)
        - gyazoctl (native binary)
        - install.sh
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      placeholder: |
        OS: macOS 15.6
        Architecture: arm64
        Node.js: 24.5.0
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: ログ
      render: shell

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: 機密情報
      options:
        - label: access tokenなどの機密情報を削除しました
          required: true
