name: 機能要望
description: 改善や新機能を提案する
title: "[Feature]: "
body:
  - type: dropdown
    id: component
    attributes:
      label: 対象
      options:
        - gyazo-api-sdk
        - gyazoctl (npm)
        - gyazoctl (native binary)
        - install.sh
        - その他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期待する振る舞い
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
